<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bibbulmun Track</title>
  <meta name="description" content="Offline trip planner for walking the Bibbulmun Track in sections.">
  <meta name="theme-color" content="#2f4a3a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16201a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bibbulmun">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <div>
        <h1>Bibbulmun Track</h1>
        <p class="tag">Damian's walk · Kalamunda to Albany</p>
      </div>
    </div>
    <span id="net" class="net" role="status" aria-live="polite"></span>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#follow" data-tab="follow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l6-12 4 7 3-4 5 9z"/></svg><span>Follow</span></a>
    <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5"/></svg><span>Plan</span></a>
    <a href="#stops" data-tab="stops"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3"/><path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/></svg><span>Stops</span></a>
    <a href="#gear" data-tab="gear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7V5a5 5 0 0110 0v2 M5 7h14l-1 14H6z"/></svg><span>Gear</span></a>
    <a href="#info" data-tab="info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6 M12 7.5v.5"/></svg><span>Info</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
